<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Racket head frame -->
  <ellipse cx="34" cy="30" rx="20" ry="24" fill="#E8E0D0" stroke="#C8A96E" stroke-width="3.5"/>
  <!-- String horizontal lines -->
  <line x1="15" y1="20" x2="53" y2="20" stroke="#B8D4F0" stroke-width="1.2" opacity="0.9"/>
  <line x1="14" y1="26" x2="54" y2="26" stroke="#B8D4F0" stroke-width="1.2" opacity="0.9"/>
  <line x1="14" y1="32" x2="54" y2="32" stroke="#B8D4F0" stroke-width="1.2" opacity="0.9"/>
  <line x1="15" y1="38" x2="53" y2="38" stroke="#B8D4F0" stroke-width="1.2" opacity="0.9"/>
  <!-- String vertical lines -->
  <line x1="22" y1="7" x2="22" y2="53" stroke="#B8D4F0" stroke-width="1.2" opacity="0.9"/>
  <line x1="28" y1="6" x2="28" y2="54" stroke="#B8D4F0" stroke-width="1.2" opacity="0.9"/>
  <line x1="34" y1="6" x2="34" y2="54" stroke="#B8D4F0" stroke-width="1.2" opacity="0.9"/>
  <line x1="40" y1="6" x2="40" y2="54" stroke="#B8D4F0" stroke-width="1.2" opacity="0.9"/>
  <line x1="46" y1="7" x2="46" y2="53" stroke="#B8D4F0" stroke-width="1.2" opacity="0.9"/>
  <!-- Racket frame overlap -->
  <ellipse cx="34" cy="30" rx="20" ry="24" fill="none" stroke="#C8A96E" stroke-width="3.5"/>
  <!-- Handle -->
  <rect x="31" y="52" width="6" height="20" rx="3" fill="#8B6914"/>
  <rect x="31" y="52" width="6" height="5" rx="1" fill="#C8A96E"/>
  <!-- Grip wrapping lines -->
  <line x1="31" y1="58" x2="37" y2="58" stroke="#6B4F10" stroke-width="1" opacity="0.6"/>
  <line x1="31" y1="62" x2="37" y2="62" stroke="#6B4F10" stroke-width="1" opacity="0.6"/>
  <line x1="31" y1="66" x2="37" y2="66" stroke="#6B4F10" stroke-width="1" opacity="0.6"/>
  <!-- Tennis ball -->
  <circle cx="58" cy="58" r="14" fill="#C8E645"/>
  <path d="M46 55 Q52 58 46 61" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M70 55 Q64 58 70 61" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Ball shine -->
  <circle cx="54" cy="53" r="3" fill="white" opacity="0.25"/>
</svg>
